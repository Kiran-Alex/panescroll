name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (debug)
        run: swift build
      - name: Test
        run: swift test
      - name: Build app bundle (release, ad-hoc signed)
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Panescroll.app
          path: build/Panescroll.app
